<!DOCTYPE html>
<html lang="en">
<head>
    <title>Machine Process Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h2>Machine Process Data</h2>
    <canvas id="processChart"></canvas>

    <script>
        const socket = io();
        socket.on("updateData", (data) => {
            const ctx = document.getElementById("processChart").getContext("2d");
            new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.map(d => new Date(d.rec_time).toLocaleString()), // Convert timestamps
                    datasets: [{
                        label: "Process Value",
                        data: data.map(d => d.process_value),
                        borderColor: "blue"
                    }]
                }
            });
        });
    </script>
</body>
</html>
