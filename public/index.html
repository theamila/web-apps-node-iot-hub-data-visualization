<!DOCTYPE html>
<html lang="en">
<head>
    <title>Machine Process Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2>Machine Data</h2>
    <input type="date" id="datePicker">
    <select id="machineSelect">
        <option value="1201">Machine A</option>
        <option value="1050">Machine B</option>
        <option value="1051">Machine C</option>
    </select>

<button onclick="filterData()">Filter</button>
<canvas id="processChart"></canvas>

<script>
    let chartInstance = null; // Store chart globally

    async function filterData() {
        const selectedDate = document.getElementById("datePicker").value;
        const response = await fetch(`/sales?date=${selectedDate}`);
        const data = await response.json();

        const ctx = document.getElementById("processChart").getContext("2d");

        // Destroy old chart if it exists
        if (chartInstance) {
            chartInstance.destroy();
        }

        // Create new chart instance
        chartInstance = new Chart(ctx, {
            type: "line",
            data: {
                labels: data.map(d => new Date(d.rec_time).toLocaleString()),
                datasets: [
                    { label: "Instant Flow", data: data.map(d => d.process_value), borderColor: "blue" },
                    { label: "Temperature", data: data.map(d => d.hot_value), borderColor: "red" }
                ]
            }
        });
    }
</script>
</body>
</html>
